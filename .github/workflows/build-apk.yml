name: Android CI

on:
  push:
    branches: [main, fix/health-sync-1.1.6-drive-binding]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile unsigned release APK
        working-directory: android
        run: gradle assembleRelease

      - name: Verify build
        run: test -f android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: HealthSync-1.1.6-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1

      - name: Package Android signing tools
        run: |
          mkdir -p signing-tools/lib signing-tools/lib64
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" signing-tools/lib64/

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-35
          path: signing-tools
          retention-days: 1
