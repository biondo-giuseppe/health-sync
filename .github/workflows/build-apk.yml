name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Prepare stable signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/healthsync-stable-keystore.p12"

      - name: Build signed release APK
        working-directory: android
        env:
          HEALTHSYNC_KEYSTORE_PATH: ${{ runner.temp }}/healthsync-stable-keystore.p12
          HEALTHSYNC_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HEALTHSYNC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HEALTHSYNC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Prepare APK asset
        run: cp android/app/build/outputs/apk/release/app-release.apk HealthSync.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HealthSync
          path: HealthSync.apk
          retention-days: 30
